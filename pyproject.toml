[project]
name = "ai-test"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Turab Manzoor", email = "turabmanzoor032@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.5.0",
    "langchain-community>=0.4.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.2.0",
    "pydantic>=2.14.3",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
ai-test = "ai_test:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
